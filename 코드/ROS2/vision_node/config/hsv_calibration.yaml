# HSV 색상 캘리브레이션 (OpenCV HSV 범위: H 0~179, S 0~255, V 0~255)
# 빨강은 H가 0 부근과 180 부근으로 갈라지므로 두 구간(lower1/2)을 OR로 합친다.
red:
  lower1: [0, 120, 70]
  upper1: [10, 255, 255]
  lower2: [170, 120, 70]
  upper2: [179, 255, 255]
yellow:
  lower: [20, 120, 70]
  upper: [35, 255, 255]

# 컨투어 면적 필터(픽셀^2): 이보다 작은 영역은 노이즈로 무시
min_area: 800
# 종횡비(장축/단축)가 이 값보다 크면 비대칭 물체로 판정
aspect_ratio_threshold: 1.5

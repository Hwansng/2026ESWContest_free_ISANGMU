# [레거시 - 현재 사용 안 함]
# detector.py(레거시 순수함수 버전)용 설정 파일임. 실제 프로덕션 vision_node.py는
# 이 파일을 안 읽고 코드 내부(self.hsv_ranges)에 값을 직접 갖고 있음.
# 아래 값은 참고용으로만 8/28 HSV 실측 결과에 맞춰 갱신해둠 (원래는 교과서적 값이었음).
#
# HSV 색상 캘리브레이션 (OpenCV HSV 범위: H 0~179, S 0~255, V 0~255)
# NoIR 카메라라 IR 차단 필터가 없어서 색이 밀림. 빨강이 자주색 쪽(H 130대)으로 이동함.
red:
  lower1: [133, 100, 60]
  upper1: [161, 255, 255]
  lower2: [133, 100, 60]
  upper2: [161, 255, 255]
yellow:
  lower: [3, 30, 100]
  upper: [31, 255, 255]
min_area: 800
aspect_ratio_threshold: 1.5